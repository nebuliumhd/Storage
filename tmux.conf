# ~/.tmux.conf  -  Zellij-style tmux, zero plugins
# Targets tmux 3.4+ (Debian 13 ships 3.5a). Needs a Nerd Font on the CLIENT terminal.

# ─────────────────────────────────────────────────────────────
# 1. Basics
# ─────────────────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g  mouse on
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -sg escape-time 0
set -g  history-limit 50000
set -g  focus-events on
set -g  set-clipboard on
set -g  aggressive-resize on
set -g  detach-on-destroy off
set -g  display-time 1500
set -g  status-interval 5
set -g  mode-keys vi
set -g  status-keys emacs
set -g  set-titles on
set -g  set-titles-string "#S : #W"

# Prefix: Ctrl-Space (Ctrl-a/Ctrl-b collide with readline / common usage)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Window names: directory when idle at bash, command name otherwise
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}"

# ─────────────────────────────────────────────────────────────
# 2. Palette (Catppuccin Mocha) + glyphs  -  edit here to retheme
# ─────────────────────────────────────────────────────────────
set -g @mantle  "#181825"
set -g @base    "#1e1e2e"
set -g @surface "#313244"
set -g @overlay "#6c7086"
set -g @subtext "#a6adc8"
set -g @text    "#cdd6f4"
set -g @blue    "#89b4fa"
set -g @green   "#a6e3a1"
set -g @yellow  "#f9e2af"
set -g @red     "#f38ba8"
set -g @mauve   "#cba6f7"
set -g @peach   "#fab387"
set -g @teal    "#94e2d5"

set -g @sep_r ""
set -g @sep_l ""

# ─────────────────────────────────────────────────────────────
# 3. Mode badge: label, color, and key hints (resolved at draw time)
#    NOTE: no commas inside the hint text, they split the conditional.
# ─────────────────────────────────────────────────────────────
set -g @mode_label "#{?pane_in_mode,SCROLL,#{?#{==:#{client_key_table},root},NORMAL,#{?#{==:#{client_key_table},prefix},PREFIX,#{?#{==:#{client_key_table},pane},PANE,#{?#{==:#{client_key_table},tab},TAB,#{?#{==:#{client_key_table},resize},RESIZE,#{client_key_table}}}}}}}"

set -g @mode_bg "#{?pane_in_mode,#{@yellow},#{?#{==:#{client_key_table},root},#{@green},#{?#{==:#{client_key_table},prefix},#{@red},#{?#{==:#{client_key_table},pane},#{@blue},#{?#{==:#{client_key_table},tab},#{@mauve},#{?#{==:#{client_key_table},resize},#{@peach},#{@teal}}}}}}}"

set -g @hint "#{?pane_in_mode,j/k move   C-u/C-d page   / search   v select   y copy   q quit,#{?#{==:#{client_key_table},prefix},p pane   t tab   r resize   s scroll   o sessions   w windows   c new tab   R reload   d detach,#{?#{==:#{client_key_table},pane},h/j/k/l focus   n new   d down   r right   x close   f full   z frames   c rename   Esc exit,#{?#{==:#{client_key_table},tab},h/l prev/next   n new   x close   r rename   [/] move   1-9 go   Esc exit,#{?#{==:#{client_key_table},resize},h/j/k/l resize   H/J/K/L big   Space layout   Esc exit,}}}}}"

# ─────────────────────────────────────────────────────────────
# 4. Status bar (top): badge + session | tabs ........ hints/host/time
# ─────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 200
set -gF status-style "bg=#{@mantle},fg=#{@text}"

set -g status-left "#[fg=#{@mantle}]#[bg=#{E:@mode_bg}]#[bold] #{E:@mode_label} #[nobold]#[fg=#{E:@mode_bg}]#[bg=#{@surface}]#{@sep_r}#[fg=#{@text}]#[bg=#{@surface}] #S #[fg=#{@surface}]#[bg=#{@mantle}]#{@sep_r}#[default] "

set -g status-right "#{?#{E:@hint},#[fg=#{@subtext}]#[bg=#{@mantle}]#{E:@hint} ,}#[fg=#{@surface}]#[bg=#{@mantle}]#{@sep_l}#[fg=#{@text}]#[bg=#{@surface}] #H #[fg=#{@blue}]#[bg=#{@surface}]#{@sep_l}#[fg=#{@mantle}]#[bg=#{@blue}]#[bold] %H:%M "

# Tabs as ribbons
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@mantle}]#[bg=#{@surface}]#{@sep_r}#[fg=#{@subtext}]#[bg=#{@surface}] #I #W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,} #[fg=#{@surface}]#[bg=#{@mantle}]#{@sep_r}"
setw -g window-status-current-format "#[fg=#{@mantle}]#[bg=#{@blue}]#{@sep_r}#[fg=#{@mantle}]#[bg=#{@blue}]#[bold] #I #W#{?window_zoomed_flag, Z,} #[nobold]#[fg=#{@blue}]#[bg=#{@mantle}]#{@sep_r}"

# ─────────────────────────────────────────────────────────────
# 5. Pane frames with titles (Zellij look)
# ─────────────────────────────────────────────────────────────
setw -g pane-border-lines heavy
setw -g pane-border-status top
setw -gF pane-border-style "fg=#{@surface}"
setw -gF pane-active-border-style "fg=#{@blue}"
setw -g pane-border-format "#{?pane_active,#[fg=#{@mantle}]#[bg=#{@blue}]#[bold],#[fg=#{@subtext}]#[bg=#{@surface}]} #{pane_index} #{pane_current_command} #[nobold]#[default] #{b:pane_current_path}#{?pane_in_mode, [scroll],}#{?window_zoomed_flag, [full],}"

# Misc UI colors
set -gF message-style         "bg=#{@blue},fg=#{@mantle},bold"
set -gF message-command-style "bg=#{@mauve},fg=#{@mantle},bold"
setw -gF mode-style           "bg=#{@mauve},fg=#{@mantle}"
setw -gF popup-style          "bg=#{@base},fg=#{@text}"
setw -gF popup-border-style   "fg=#{@blue}"
setw -g  popup-border-lines   rounded
setw -gF clock-mode-colour    "#{@blue}"
set  -gF display-panes-colour "#{@overlay}"
set  -gF display-panes-active-colour "#{@red}"

# ─────────────────────────────────────────────────────────────
# 6. Root-table shortcuts (no prefix)
# ─────────────────────────────────────────────────────────────
# Alt+h/j/k/l: focus
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+n: new pane, direction chosen by pane shape
bind -n M-n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'

# Alt+f: toggle floating scratch terminal (popup attached to a "scratch" session)
bind -n M-f if -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -E -w 80% -h 80% -b rounded -T ' scratch ' -d '#{pane_current_path}' "env -u TMUX tmux new-session -A -s scratch ';' set-option -t scratch status off"
}

# ─────────────────────────────────────────────────────────────
# 7. Prefix-table bindings (enter modes, misc)
# ─────────────────────────────────────────────────────────────
bind p switch-client -T pane
bind t switch-client -T tab
bind r switch-client -T resize
bind s copy-mode
bind o choose-tree -Zs
bind R source-file ~/.tmux.conf \; display-message "Config reloaded"

# New things inherit the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"

# Copy mode (vi)
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# ─────────────────────────────────────────────────────────────
# 8. PANE mode (Prefix p) - sticky; Esc / Enter / q / any other key exits
# ─────────────────────────────────────────────────────────────
bind -T pane h     select-pane -L \; switch-client -T pane
bind -T pane j     select-pane -D \; switch-client -T pane
bind -T pane k     select-pane -U \; switch-client -T pane
bind -T pane l     select-pane -R \; switch-client -T pane
bind -T pane Left  select-pane -L \; switch-client -T pane
bind -T pane Down  select-pane -D \; switch-client -T pane
bind -T pane Up    select-pane -U \; switch-client -T pane
bind -T pane Right select-pane -R \; switch-client -T pane
bind -T pane p     select-pane -t :.+ \; switch-client -T pane

bind -T pane n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"' \; switch-client -T pane
bind -T pane d split-window -v -c "#{pane_current_path}" \; switch-client -T pane
bind -T pane r split-window -h -c "#{pane_current_path}" \; switch-client -T pane
bind -T pane x kill-pane \; switch-client -T pane
bind -T pane f resize-pane -Z \; switch-client -T pane
bind -T pane z if -F '#{==:#{pane-border-status},off}' 'set -w pane-border-status top' 'set -w pane-border-status off' \; switch-client -T pane
bind -T pane c command-prompt -I "#T" "select-pane -T '%%'"

bind -T pane Escape switch-client -T root
bind -T pane Enter  switch-client -T root
bind -T pane q      switch-client -T root

# ─────────────────────────────────────────────────────────────
# 9. TAB mode (Prefix t)
# ─────────────────────────────────────────────────────────────
bind -T tab h     previous-window \; switch-client -T tab
bind -T tab l     next-window \; switch-client -T tab
bind -T tab Left  previous-window \; switch-client -T tab
bind -T tab Right next-window \; switch-client -T tab
bind -T tab n     new-window -c "#{pane_current_path}" \; switch-client -T tab
bind -T tab x     kill-window \; switch-client -T tab
bind -T tab r     command-prompt -I "#W" "rename-window -- '%%'"
bind -T tab [     swap-window -t -1 \; select-window -t -1 \; switch-client -T tab
bind -T tab ]     swap-window -t +1 \; select-window -t +1 \; switch-client -T tab

bind -T tab 1 select-window -t :1
bind -T tab 2 select-window -t :2
bind -T tab 3 select-window -t :3
bind -T tab 4 select-window -t :4
bind -T tab 5 select-window -t :5
bind -T tab 6 select-window -t :6
bind -T tab 7 select-window -t :7
bind -T tab 8 select-window -t :8
bind -T tab 9 select-window -t :9

bind -T tab Escape switch-client -T root
bind -T tab Enter  switch-client -T root
bind -T tab q      switch-client -T root

# ─────────────────────────────────────────────────────────────
# 10. RESIZE mode (Prefix r)
# ─────────────────────────────────────────────────────────────
bind -T resize h     resize-pane -L 3  \; switch-client -T resize
bind -T resize j     resize-pane -D 3  \; switch-client -T resize
bind -T resize k     resize-pane -U 3  \; switch-client -T resize
bind -T resize l     resize-pane -R 3  \; switch-client -T resize
bind -T resize Left  resize-pane -L 3  \; switch-client -T resize
bind -T resize Down  resize-pane -D 3  \; switch-client -T resize
bind -T resize Up    resize-pane -U 3  \; switch-client -T resize
bind -T resize Right resize-pane -R 3  \; switch-client -T resize
bind -T resize H     resize-pane -L 10 \; switch-client -T resize
bind -T resize J     resize-pane -D 10 \; switch-client -T resize
bind -T resize K     resize-pane -U 10 \; switch-client -T resize
bind -T resize L     resize-pane -R 10 \; switch-client -T resize
bind -T resize Space next-layout \; switch-client -T resize

bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root
bind -T resize q      switch-client -T root
